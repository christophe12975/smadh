  const errors = {};
  if(!nom || nom.trim().length < 3) errors.nom = "Le nom complet doit contenir au moins 3 caractères.";
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if(!email || !emailRe.test(email.trim())) errors.email = "Adresse email invalide.";
  if(!identifiant || identifiant.trim().length < 3) errors.identifiant = "L'identifiant doit contenir au moins 3 caractères.";
  else if(!/^[a-zA-Z0-9._-]+$/.test(identifiant.trim())) errors.identifiant = "Lettres, chiffres, points, tirets et underscores uniquement.";
  if(!pass || pass.length < 6) errors.pass = "Le mot de passe doit contenir au moins 6 caractères.";
  if(!passConfirm) errors.passConfirm = "Merci de confirmer le mot de passe.";
  else if(pass && passConfirm && pass !== passConfirm) errors.passConfirm = "Les mots de passe ne correspondent pas.";
  if(!inst || inst.trim().length < 2) errors.inst = "L'institution est obligatoire.";
  if(!['scientifique', 'décideur'].includes(role)) errors.role = "Veuillez choisir un rôle valide.";
  return errors;
}

function showFieldError(fieldId, message) {
  const input = document.getElementById(fieldId);
  const err = document.getElementById(fieldId + "-error");
  if(input) input.classList.add("input-error");
  if(err) { err.textContent = message; err.classList.add("show"); }
}
function clearFieldErrors(ids) {
  ids.forEach(id => {
    const input = document.getElementById(id);
    const err = document.getElementById(id + "-error");
    if(input) input.classList.remove("input-error");
    if(err) { err.textContent = ""; err.classList.remove("show"); }
  });
}
function showFormAlert(id, message, variant) {
  const box = document.getElementById(id);
  if(box) {
    box.textContent = message;
    box.classList.add("show");
    box.classList.toggle("info", variant === "info");
  }
}
function hideFormAlert(id) {
  const box = document.getElementById(id);
  if(box) { box.classList.remove("show"); box.classList.remove("info"); }
}

async function registerAccount({nom, email, identifiant, pass, inst, role}) {
  const { data: authData, error: authError } = await supabaseClient.auth.signUp({
    email: email,
    password: pass,
    options: {
      data: { nom: nom, identifiant: identifiant, institution: inst, role: role }
    }
  });
  if(authError) throw new Error(traduireErreurSupabase(authError.message));
  return authData.user;
}

async function loginAccount(email, pass) {
  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: pass
  });
  if(error) throw new Error(traduireErreurSupabase(error.message));

  let { data: profile, error: profileError } = await supabaseClient
    .from('profiles')
    .select('*')
    .eq('id', data.user.id)
    .single();

  if(profileError) {
    const meta = data.user.user_metadata || {};
    const fallbackRole = ['décideur', 'scientifique'].includes(meta.role) ? meta.role : 'scientifique';
    const fallback = {
      nom: meta.nom || email.split("@")[0],
      identifiant: meta.identifiant || email.split("@")[0],
      inst: meta.institution || "Non renseignée",
      role: fallbackRole
    };

    const { data: newProfile, error: insertError } = await supabaseClient
      .from('profiles')
      .insert({ id: data.user.id, identifiant: fallback.identifiant, nom: fallback.nom, institution: fallback.inst, role: fallback.role })
      .select()
      .single();

    if(insertError) {
      if(insertError.message.includes("duplicate key") || insertError.code === "23505") {
        throw new Error("Cet identifiant est déjà utilisé. Contacte un administrateur.");
      }
      throw new Error("Connexion réussie mais échec de création du profil : " + insertError.message);
    }

    profile = newProfile;
  }

  return { ...profile, email: data.user.email };
}

function traduireErreurSupabase(msg) {
  if(msg.includes("already registered")) return "Cet email est déjà utilisé.";
  if(msg.includes("Email not confirmed")) return "Email non confirmé. Vérifie ta boîte mail (et spams) puis clique sur le lien de confirmation.";
  if(msg.includes("Invalid login credentials")) return "Email ou mot de passe incorrect.";
  if(msg.includes("Password should be")) return "Le mot de passe doit contenir au moins 6 caractères.";
  return msg;
}

async function doLogin() {
  hideFormAlert("login-alert");
  clearFieldErrors(["login-user","login-pass"]);

  const email = (document.getElementById("login-user")?.value || "").trim();
  const pass = document.getElementById("login-pass")?.value || "";

  let hasError = false;
  if(!email) { showFieldError("login-user","L'email est obligatoire."); hasError = true; }
  if(!pass) { showFieldError("login-pass","Le mot de passe est obligatoire."); hasError = true; }
  if(hasError) return;

  const btn = document.getElementById("login-btn");
  if(btn) { btn.disabled = true; btn.textContent = "Connexion en cours..."; }

  try {
    const profile = await loginAccount(email, pass);
    setState({
      user: { nom: profile.nom, role: profile.role, email: profile.email, institution: profile.institution, identifiant: profile.identifiant, avatar_url: profile.avatar_url },
      screen: "dashboard"
    });
  } catch(e) {
    showFormAlert("login-alert", e.message);
  } finally {
    if(btn) { btn.disabled = false; btn.textContent = "Se connecter"; }
  }
}

async function doRegister() {
  hideFormAlert("reg-alert");
  clearFieldErrors(["reg-nom","reg-email","reg-identifiant","reg-pass","reg-pass-confirm","reg-inst"]);

  const nom  = document.getElementById("reg-nom")?.value || "";
  const email= document.getElementById("reg-email")?.value || "";
  const identifiant = document.getElementById("reg-identifiant")?.value || "";
  const pass = document.getElementById("reg-pass")?.value || "";
  const passConfirm = document.getElementById("reg-pass-confirm")?.value || "";
  const inst = document.getElementById("reg-inst")?.value || "";
  const role = state.selectedRegRole;

  const errors = validateRegistration({nom, email, identifiant, pass, passConfirm, inst, role});
  if(Object.keys(errors).length > 0) {
    if(errors.nom) showFieldError("reg-nom", errors.nom);
    if(errors.email) showFieldError("reg-email", errors.email);
    if(errors.identifiant) showFieldError("reg-identifiant", errors.identifiant);
    if(errors.pass) showFieldError("reg-pass", errors.pass);
    if(errors.passConfirm) showFieldError("reg-pass-confirm", errors.passConfirm);
    if(errors.inst) showFieldError("reg-inst", errors.inst);
    showFormAlert("reg-alert", "Merci de corriger les champs indiqués ci-dessous.");
    return;
  }

  const btn = document.getElementById("reg-btn");
  if(btn) { btn.disabled = true; btn.textContent = "Création en cours..."; }

  try {
    await registerAccount({
      nom: nom.trim(),
      email: email.trim(),
      identifiant: identifiant.trim(),
      pass: pass,
      inst: inst.trim(),
      role: role
    });

    hideFormAlert("reg-alert");
    setState({ screen: "auth", authTab: "login" });
    setTimeout(() => {
      showFormAlert("login-alert", "Compte créé ! Vérifie ta boîte mail pour valider ton compte avant de te connecter.", "info");
    }, 50);
  } catch(e) {
    console.error("Erreur inscription:", e);
    showFormAlert("reg-alert", e.message);
  } finally {
    if(btn) { btn.disabled = false; btn.textContent = "Créer mon compte"; }

async function handleAvatarChange(event) {
  const file = event.target.files?.[0];
  if(!file) return;

  if(!["image/png","image/jpeg","image/webp"].includes(file.type)) {
    alert("Format non supporté. Utilise une image PNG, JPEG ou WebP.");
    return;
  }
  if(file.size > 4 * 1024 * 1024) {
    alert("Image trop lourde (max 4 Mo).");
    return;
  }

  setState({ avatarUploading: true });

  try {
    const { data: sessionData } = await supabaseClient.auth.getSession();
    const userId = sessionData?.session?.user?.id;
    if(!userId) throw new Error("Session expirée, reconnecte-toi.");

    const ext = file.name.split(".").pop().toLowerCase();
    const path = `${userId}/avatar.${ext}`;

    const { error: uploadError } = await supabaseClient.storage
      .from("avatars")
      .upload(path, file, { upsert: true, cacheControl: "3600" });
    if(uploadError) throw uploadError;

    const { data: publicUrlData } = supabaseClient.storage
      .from("avatars")
      .getPublicUrl(path);

    const avatarUrl = publicUrlData.publicUrl + "?t=" + Date.now();

    const { error: updateError } = await supabaseClient
      .from("profiles")
      .update({ avatar_url: avatarUrl })
      .eq("id", userId);
    if(updateError) throw updateError;

    setState({
      user: { ...state.user, avatar_url: avatarUrl },
      avatarUploading: false
    });
  } catch(e) {
    console.error("Erreur upload avatar:", e);
    alert("Échec de l'envoi de la photo : " + e.message);
    setState({ avatarUploading: false });
  }
}

        <div style="font-size:13px;color:#e8f4f0;margin-bottom:4px;">• Débit médian (Q₅₀) : <b>${res.q50} m³/s</b></div>

function runPredictionSimulation() {
  const prcptot = parseFloat(document.getElementById("inp-prcptot").value) || 1200;
  const rx5day = parseFloat(document.getElementById("inp-rx5day").value) || 115;
  const tr = parseFloat(document.getElementById("inp-tr").value) || 45;

  const q5 = Math.max(0.5, (tr * 0.12).toFixed(2));
  const q50 = (prcptot * 0.15 + tr * 0.8).toFixed(2);
  const q95 = (rx5day * 7.5 + prcptot * 0.25).toFixed(2);

  setState({ predResult: { q5, q50, q95 } });
}

function parseDate(dateStr) {
  if(!dateStr) return null;
  // Objet Date JavaScript (XLSX avec cellDates:true)
  if(dateStr instanceof Date) return isNaN(dateStr.getTime())?null:dateStr;
  const s=String(dateStr).trim();
  // DD/MM/YYYY
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)){
    const p=s.split('/');
    return new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));
  }
  // YYYY-MM-DD
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return new Date(s.substring(0,10));
  // Numero de serie Excel (33239 = 01/01/1991)
  const n=parseFloat(s);
  if(!isNaN(n)&&n>10000&&n<100000)
    return new Date(new Date(1899,11,30).getTime()+Math.floor(n)*86400000);
  // Format "Mon Jan 01 1991 ..." (Date.toString)
  const d=new Date(s);
  if(!isNaN(d.getTime())) return d;
  return null;
}
function getYear(dateStr){
  if(dateStr instanceof Date) return isNaN(dateStr.getTime())?null:dateStr.getFullYear();
  const s=String(dateStr).trim();
  // DD/MM/YYYY
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)) return parseInt(s.split('/')[2]);
  // M/D/YY ou M/D/YYYY (format XLSX americain)
  if(/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(s)){
    const p=s.split('/');
    const yr=parseInt(p[2]);
    // YY -> YYYY : 00-30 = 2000-2030, 31-99 = 1931-1999
    return yr<100?(yr<=30?2000+yr:1900+yr):yr;
  }
  // YYYY-MM-DD
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return parseInt(s.substring(0,4));
  // Numero serie Excel
  const n=parseFloat(s);
  if(!isNaN(n)&&n>10000&&n<100000)
    return new Date(new Date(1899,11,30).getTime()+Math.floor(n)*86400000).getFullYear();
  const d=new Date(s);
  return isNaN(d.getTime())?null:d.getFullYear();
}
function getDOY(dateStr){
  if(dateStr instanceof Date&&!isNaN(dateStr.getTime())){
    return Math.floor((dateStr-new Date(dateStr.getFullYear(),0,0))/86400000);
  }
  const s=String(dateStr).trim();
  // DD/MM/YYYY
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)){
    const p=s.split('/');
    const d=new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));
    return Math.floor((d-new Date(d.getFullYear(),0,0))/86400000);
  }
  // M/D/YY ou M/D/YYYY (XLSX americain) — ici p[0]=mois, p[1]=jour
  if(/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(s)){
    const p=s.split('/');
    const yr=parseInt(p[2]);
    const fullYr=yr<100?(yr<=30?2000+yr:1900+yr):yr;
    // Attention: format M/D/YY => mois=p[0], jour=p[1]
    const d=new Date(fullYr,parseInt(p[0])-1,parseInt(p[1]));
    return Math.floor((d-new Date(fullYr,0,0))/86400000);
  }
  const d=parseDate(dateStr);
  if(!d)return 1;
  return Math.floor((d-new Date(d.getFullYear(),0,0))/86400000);
}
function parseNum(val){
  if(val===null||val===undefined||val==='')return null;
  const n=parseFloat(String(val).replace(',','.'));return isNaN(n)?null:n;
}
function percentile(arr,p){
  if(!arr.length)return null;
  const s=[...arr].sort((a,b)=>a-b);
  const idx=(p/100)*(s.length-1);
  const lo=Math.floor(idx),hi=Math.ceil(idx);
  return lo===hi?s[lo]:s[lo]+(s[hi]-s[lo])*(idx-lo);
}
function maxConsecutive(arr,cond){let mx=0,cur=0;for(let v of arr){if(cond(v)){cur++;if(cur>mx)mx=cur;}else cur=0;}return mx;}
function sumConsecutiveSeq(arr,cond,minLen){let tot=0,i=0;while(i<arr.length){if(cond(arr[i])){let j=i;while(j<arr.length&&cond(arr[j]))j++;if((j-i)>=minLen)tot+=(j-i);i=j;}else i++;}return tot;}

// ============================================================
// MODULE CALCUL INDICES ETCCDI - JavaScript
// Traduction fidele des codes MATLAB
// ============================================================

// ---- UTILITAIRES ----
function parseNum(val) {
  if (val === null || val === undefined || val === '') return null;
  const n = parseFloat(String(val).replace(',', '.'));
  return isNaN(n) ? null : n;
}

function getYear(dateStr) {
  if (!dateStr) return null;
  // Formats : DD/MM/YYYY ou YYYY-MM-DD ou objet Date
  const s = String(dateStr);
  if (s.includes('/')) {
    const parts = s.split('/');
    return parseInt(parts[2]);
  }
  if (s.includes('-')) {
    return parseInt(s.split('-')[0]);
  }
  return null;
}

function getDOY(dateStr) {
  // Jour de l'annee (1-366)
  const s = String(dateStr);
  let d;
  if (s.includes('/')) {
    const p = s.split('/');
    d = new Date(parseInt(p[2]), parseInt(p[1])-1, parseInt(p[0]));
  } else {
    d = new Date(s);
  }
  const start = new Date(d.getFullYear(), 0, 0);
  const diff = d - start;
  return Math.floor(diff / 86400000);
}

function percentile(arr, p) {
  if (!arr.length) return null;
  const sorted = [...arr].sort((a, b) => a - b);
  const idx = (p / 100) * (sorted.length - 1);
  const lo = Math.floor(idx);
  const hi = Math.ceil(idx);
  if (lo === hi) return sorted[lo];
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (idx - lo);
}

function maxConsecutive(arr, condition) {
  let maxLen = 0, cur = 0;
  for (let i = 0; i < arr.length; i++) {
    if (condition(arr[i])) {
      cur++;
      if (cur > maxLen) maxLen = cur;
    } else {
      cur = 0;
    }
  }
  return maxLen;
}

function sumConsecutiveSeq(arr, condition, minLen) {
  // WSDI / CSDI : somme des jours dans sequences >= minLen jours
  let total = 0, i = 0;
  while (i < arr.length) {
    if (condition(arr[i])) {
      let j = i;
      while (j < arr.length && condition(arr[j])) j++;
      if ((j - i) >= minLen) total += (j - i);
      i = j;
    } else {
      i++;
    }
  }
  return total;
}

// ============================================================
// INDICES DE PRECIPITATIONS
// ============================================================
function calculIndicesPrecipitations(data) {
  // data : tableau de { Date, STATION1, STATION2, ... }
  // Retourne : { STATION: { annees:[], PRCPTOT:[], RX1day:[], ... } }

  const SEUIL_PLUIE = 1.0;
  const SEUIL_R10   = 10.0;
  const SEUIL_R20   = 20.0;

  if (!data || !data.length) return null;

  const cols = Object.keys(data[0]);
  const dateCol = cols.find(c => c.toLowerCase().includes('date')) || cols[0];
  const stations = cols.filter(c => c !== dateCol);

  // Extraire les annees uniques
  const years = [...new Set(data.map(r => getYear(r[dateCol])).filter(Boolean))].sort((a,b)=>a-b);

  const results = {};

  stations.forEach(station => {
    const PRCPTOT = [], RX1day = [], Rx5day = [], R10 = [], R20 = [], SDII = [], CDD = [], CWD = [];

    years.forEach(an => {
      const rows = data.filter(r => getYear(r[dateCol]) === an);
      const P = rows.map(r => {
        const v = parseNum(r[station]);
        return (v === null || isNaN(v)) ? 0 : v;
      });

      const wet = P.map(p => p >= SEUIL_PLUIE);
      const wetVals = P.filter((p, i) => wet[i]);

      // PRCPTOT
      PRCPTOT.push(+wetVals.reduce((a, b) => a + b, 0).toFixed(2));

      // RX1day
      RX1day.push(+Math.max(...P).toFixed(2));

      // Rx5day - fenetre glissante de 5 jours
      let maxRx5 = 0;
      for (let i = 0; i <= P.length - 5; i++) {
        const s5 = P[i] + P[i+1] + P[i+2] + P[i+3] + P[i+4];
        if (s5 > maxRx5) maxRx5 = s5;
      }
      Rx5day.push(+maxRx5.toFixed(2));

      // R10 / R20
      R10.push(P.filter(p => p >= SEUIL_R10).length);
      R20.push(P.filter(p => p >= SEUIL_R20).length);

      // SDII
      const nWet = wetVals.length;
      SDII.push(nWet > 0 ? +(wetVals.reduce((a,b)=>a+b,0) / nWet).toFixed(3) : 0);

      // CDD - plus longue sequence seche
      CDD.push(maxConsecutive(P, p => p < SEUIL_PLUIE));

      // CWD - plus longue sequence humide
      CWD.push(maxConsecutive(P, p => p >= SEUIL_PLUIE));
    });

    results[station] = { annees: years, PRCPTOT, RX1day, Rx5day, R10, R20, SDII, CDD, CWD };
  });

  return results;
}

// ============================================================
// INDICES DE TEMPERATURES
// ============================================================
function calculIndicesTemperatures(dataTmax, dataTmin) {
  // dataTmax / dataTmin : { Date, Cotonou, Bohicon, Save, Parakou }
  // Retourne : { STATION: { annees:[], SU25:[], TR20:[], ... } }

  const SEQLEN = 6;  // longueur minimale sequence WSDI/CSDI

  if (!dataTmax || !dataTmax.length) return null;

  const cols = Object.keys(dataTmax[0]);
  const dateCol = cols.find(c => c.toLowerCase().includes('date')) || cols[0];
  const stations = cols.filter(c => c !== dateCol);

  const years = [...new Set(dataTmax.map(r => getYear(r[dateCol])).filter(Boolean))].sort((a,b)=>a-b);

  // Periode de reference = toute la serie (comme dans le code MATLAB : ref_debut = annee(1), ref_fin = ref_debut + 29)
  const refDebut = years[0];
  const refFin   = refDebut + 29;

  const results = {};

  stations.forEach(station => {
    // Extraire Tmax et Tmin
    const TX_all = dataTmax.map(r => parseNum(r[station]));
    const TN_all = dataTmin.map(r => {
      // Chercher la colonne correspondante dans dataTmin
      const tminCols = Object.keys(dataTmin[0]);
      const matchCol = tminCols.find(c => c.toLowerCase().replace(/[^a-z]/g,'') === station.toLowerCase().replace(/[^a-z]/g,'')) || station;
      return parseNum(dataTmin[dataTmax.indexOf(r)]?.[matchCol]);
    });

    // DOY pour chaque ligne
    const doy_all = dataTmax.map(r => getDOY(r[dateCol]));

    // Indices de reference (annees refDebut a refFin)
    const idxRef = dataTmax.map((r, i) => {
      const yr = getYear(r[dateCol]);
      return yr >= refDebut && yr <= refFin;
    });

    const TX_ref  = TX_all.filter((_, i) => idxRef[i] && TX_all[i] !== null);
    const TN_ref  = TN_all.filter((_, i) => idxRef[i] && TN_all[i] !== null);
    const doy_ref = doy_all.filter((_, i) => idxRef[i]);

    // Calculer percentiles par DOY (fenetre +-5 jours)
    const p10_TX = new Array(367).fill(null);
    const p90_TX = new Array(367).fill(null);
    const p10_TN = new Array(367).fill(null);
    const p90_TN = new Array(367).fill(null);

    for (let j = 1; j <= 366; j++) {
      const window = [];
      for (let d = j-5; d <= j+5; d++) {
        let dw = ((d - 1) % 366 + 366) % 366 + 1;
        window.push(dw);
      }
      const mask = doy_ref.map(d => window.includes(d));
      const txW = TX_ref.filter((_, i) => mask[i]);
      const tnW = TN_ref.filter((_, i) => mask[i]);
      if (txW.length >= 5) {
        p10_TX[j] = percentile(txW, 10);
        p90_TX[j] = percentile(txW, 90);
      }
      if (tnW.length >= 5) {
        p10_TN[j] = percentile(tnW, 10);
        p90_TN[j] = percentile(tnW, 90);
      }
    }

    // Seuils par jour
    const thr_TX10 = doy_all.map(d => p10_TX[d]);
    const thr_TX90 = doy_all.map(d => p90_TX[d]);
    const thr_TN10 = doy_all.map(d => p10_TN[d]);
    const thr_TN90 = doy_all.map(d => p90_TN[d]);

    const SU25  = [], TR20  = [];
    const TN10p = [], TX10p = [];
    const TN90p = [], TX90p = [];
    const WSDI  = [], CSDI  = [];
    const DTR   = [];

    years.forEach(an => {
      const idxAn = dataTmax.map((r, i) => getYear(r[dateCol]) === an);
      const n = idxAn.filter(Boolean).length;

      const tx   = TX_all.filter((_, i) => idxAn[i]);
      const tn   = TN_all.filter((_, i) => idxAn[i]);
      const t10x = thr_TX10.filter((_, i) => idxAn[i]);
      const t90x = thr_TX90.filter((_, i) => idxAn[i]);
      const t10n = thr_TN10.filter((_, i) => idxAn[i]);
      const t90n = thr_TN90.filter((_, i) => idxAn[i]);

      SU25.push(tx.filter(v => v !== null && v > 25).length);
      TR20.push(tn.filter(v => v !== null && v > 20).length);

      TN10p.push(n > 0 ? +(100 * tn.filter((v,i) => v !== null && t10n[i] !== null && v < t10n[i]).length / n).toFixed(3) : 0);
      TX10p.push(n > 0 ? +(100 * tx.filter((v,i) => v !== null && t10x[i] !== null && v < t10x[i]).length / n).toFixed(3) : 0);
      TN90p.push(n > 0 ? +(100 * tn.filter((v,i) => v !== null && t90n[i] !== null && v > t90n[i]).length / n).toFixed(3) : 0);
      TX90p.push(n > 0 ? +(100 * tx.filter((v,i) => v !== null && t90x[i] !== null && v > t90x[i]).length / n).toFixed(3) : 0);

      const dtrVals = tx.map((v, i) => (v !== null && tn[i] !== null) ? v - tn[i] : null).filter(v => v !== null);
      DTR.push(dtrVals.length > 0 ? +(dtrVals.reduce((a,b)=>a+b,0)/dtrVals.length).toFixed(3) : null);

      // WSDI
      const hot = tx.map((v,i) => v !== null && t90x[i] !== null && v > t90x[i]);
      WSDI.push(sumConsecutiveSeq(hot, v => v === true, SEQLEN));

      // CSDI
      const cold = tn.map((v,i) => v !== null && t10n[i] !== null && v < t10n[i]);
      CSDI.push(sumConsecutiveSeq(cold, v => v === true, SEQLEN));
    });

    results[station] = { annees: years, SU25, TR20, TN10p, TX10p, TN90p, TX90p, WSDI, CSDI, DTR };
  });

  return results;
}

// ---- ETAPE 1 : MOYENNE PAR INDICE PAR ANNEE ----
function moyenneParAnnee(results, indices) {
  // results : { station: { annees:[], INDICE:[], ... } }
  // Retourne : { annee: { INDICE: valeur_moyenne } }
  if (!results) return null;
  const stations = Object.keys(results);
  if (!stations.length) return null;
  const annees = results[stations[0]].annees;
  const out = {};
  annees.forEach((an, i) => {
    out[an] = {};
    indices.forEach(idx => {
      const vals = stations
        .map(st => results[st][idx] ? results[st][idx][i] : null)
        .filter(v => v !== null && !isNaN(v));
      out[an][idx] = vals.length > 0
        ? +(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(4)
        : null;
    });
  });
  return out;
}

// ---- ETAPE 2 : FUSIONNER EN BASE UNIQUE ----
function fusionnerBase(debitResults, precipResults, tempResults) {
  if (!debitResults) return null;
  const annees = debitResults.annees;

  const indicesPrecip = ['PRCPTOT','RX1day','Rx5day','R10','R20','SDII','CDD','CWD'];
  const indicesTemp   = ['SU25','TR20','TN10p','TX10p','TN90p','TX90p','WSDI','CSDI'];

  const moyPrecip = precipResults ? moyenneParAnnee(precipResults, indicesPrecip) : null;
  const moyTemp   = tempResults   ? moyenneParAnnee(tempResults,   indicesTemp)   : null;

  const base = [];
  annees.forEach((an, i) => {
    const row = { Annee: an };
    // Debits
    ['Q5','Q10','Q50','Q90','Q95'].forEach(q => {
      row[q] = debitResults[q] ? debitResults[q][i] : null;
    });
    // Precipitations
    indicesPrecip.forEach(idx => {
      row[idx] = moyPrecip && moyPrecip[an] ? moyPrecip[an][idx] : null;
    });
    // Temperatures
    indicesTemp.forEach(idx => {
      row[idx] = moyTemp && moyTemp[an] ? moyTemp[an][idx] : null;
    });
    base.push(row);
  });
  return base;
}

// ---- ETAPE 3 : RANGS POUR SPEARMAN ----
function calculRangs(arr) {
  const valid = arr.map((v, i) => ({ v, i })).filter(x => x.v !== null && !isNaN(x.v));
  valid.sort((a, b) => a.v - b.v);
  const rangs = new Array(arr.length).fill(null);
  let i = 0;
  while (i < valid.length) {
    let j = i;
    while (j + 1 < valid.length && valid[j+1].v === valid[i].v) j++;
    const rangMoy = (i + j) / 2 + 1;
    for (let k = i; k <= j; k++) rangs[valid[k].i] = rangMoy;
    i = j + 1;
  }
  return rangs;
}

function spearman(x, y) {
  // Filtrer les paires valides
  const paires = x.map((v, i) => ({ x: v, y: y[i] }))
                  .filter(p => p.x !== null && p.y !== null && !isNaN(p.x) && !isNaN(p.y));
  const n = paires.length;
  if (n < 3) return { rho: null, pval: null, n };

  const rx = calculRangs(paires.map(p => p.x));
  const ry = calculRangs(paires.map(p => p.y));

  const mx = rx.reduce((a,b) => a+b, 0) / n;
  const my = ry.reduce((a,b) => a+b, 0) / n;

  let num = 0, dx2 = 0, dy2 = 0;
  for (let i = 0; i < n; i++) {
    num  += (rx[i] - mx) * (ry[i] - my);
    dx2  += (rx[i] - mx) ** 2;
    dy2  += (ry[i] - my) ** 2;
  }
  const rho = (dx2 && dy2) ? num / Math.sqrt(dx2 * dy2) : 0;

  // Test Student : t = rho * sqrt(n-2) / sqrt(1-rho2)
  const t = rho * Math.sqrt(n - 2) / Math.sqrt(Math.max(1e-10, 1 - rho * rho));

  // p-value approx (loi de Student bilaterale, ddl = n-2)
  // Approximation de Hill (1970) pour p-value
  const pval = studentPval(Math.abs(t), n - 2);

  return { rho: +rho.toFixed(4), pval: +pval.toFixed(4), n, t: +t.toFixed(4) };
}

function studentPval(t, df) {
  // Approximation de la p-value bilaterale par la loi de Student
  // Utilise l'approximation de la fonction Beta incomplete
  const x = df / (df + t * t);
  const p = incompleteBeta(x, df/2, 0.5);
  return Math.min(1, Math.max(0, p));
}

function incompleteBeta(x, a, b) {
  // Approximation numerique simple (Continued Fraction)
  if (x <= 0) return 0;
  if (x >= 1) return 1;
  const lbeta = lgamma(a) + lgamma(b) - lgamma(a + b);
  const front = Math.exp(Math.log(x)*a + Math.log(1-x)*b - lbeta) / a;
  return front * betaCF(x, a, b);
}

function betaCF(x, a, b) {
  const maxIter = 100, eps = 3e-7;
  let am = 1, bm = 1, az = 1;
  let qab = a + b, qap = a + 1, qam = a - 1;
  let bz = 1 - qab * x / qap;
  for (let m = 1; m <= maxIter; m++) {
    const em = m, tem = em + em;
    let d = em * (b - m) * x / ((qam + tem) * (a + tem));
    let ap = az + d * am; let bp = bz + d * bm;
    d = -(a + em) * (qab + em) * x / ((a + tem) * (qap + tem));
    let app = ap + d * az; let bpp = bp + d * bz;
    let aold = az;
    am = ap / bpp; bm = bp / bpp; az = app / bpp; bz = 1;
    if (Math.abs(az - aold) < eps * Math.abs(az)) return az;
  }
  return az;
}

function lgamma(x) {
  // Stirling approximation
  const c = [76.18009172947146,-86.50532032941677,24.01409824083091,
             -1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];
  let y = x, tmp = x + 5.5;
  tmp -= (x + 0.5) * Math.log(tmp);
  let ser = 1.000000000190015;
  for (let j = 0; j < 6; j++) { y++; ser += c[j] / y; }
  return -tmp + Math.log(2.5066282746310005 * ser / x);
}

// ---- ETAPE 4 : MATRICE DE CORRELATION SPEARMAN ----
function calculMatriceSpearman(base) {
  if (!base || base.length < 3) return null;

  const debits  = ['Q5','Q10','Q50','Q90','Q95'];
  const indices = ['PRCPTOT','RX1day','Rx5day','R10','R20','SDII','CDD','CWD',
                   'SU25','TR20','TN10p','TX10p','TN90p','TX90p','WSDI','CSDI'];

  const matrice = {};
  indices.forEach(idx => {
    matrice[idx] = {};
    const xArr = base.map(r => r[idx]);
    debits.forEach(dbt => {
      const yArr = base.map(r => r[dbt]);
      matrice[idx][dbt] = spearman(xArr, yArr);
    });
  });
  return { matrice, debits, indices };
}

// ---- EXPORT BASE FUSIONNEE EXCEL ----
function exportBaseFusionnee(base) {
  if (!base || !base.length) { alert("Base vide."); return; }
  if (typeof XLSX === "undefined") { alert("XLSX non disponible."); return; }

  const wb = XLSX.utils.book_new();
  const cols = Object.keys(base[0]);
  const rows = [cols];
  base.forEach(r => rows.push(cols.map(c => r[c])));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), "Base_Fusionnee");

  // Feuille statistiques descriptives
  const statCols = cols.filter(c => c !== 'Annee');
  const statRows = [['Variable','Moyenne','Ecart-type','Minimum','Maximum']];
  statCols.forEach(col => {
    const vals = base.map(r => r[col]).filter(v => v !== null && !isNaN(v));
    if (!vals.length) return;
    const mean = vals.reduce((a,b)=>a+b,0)/vals.length;
    const std  = Math.sqrt(vals.reduce((a,b)=>a+(b-mean)**2,0)/vals.length);
    statRows.push([col, +mean.toFixed(4), +std.toFixed(4),
                   +Math.min(...vals).toFixed(4), +Math.max(...vals).toFixed(4)]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(statRows), "Statistiques");
  XLSX.writeFile(wb, "Base_Fusionnee_ETCCDI_Debits.xlsx");
}

// ---- EXPORT MATRICE SPEARMAN EXCEL ----
function exportMatriceSpearman(result) {
  if (!result) { alert("Calculez d abord la matrice."); return; }
  if (typeof XLSX === "undefined") { alert("XLSX non disponible."); return; }

  const { matrice, debits, indices } = result;
  const wb = XLSX.utils.book_new();

  // Feuille rho
  const rhoRows = [['Indice', ...debits]];
  indices.forEach(idx => {
    rhoRows.push([idx, ...debits.map(d => matrice[idx][d].rho)]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rhoRows), "Rho_Spearman");

  // Feuille p-values
  const pRows = [['Indice', ...debits]];
  indices.forEach(idx => {
    pRows.push([idx, ...debits.map(d => matrice[idx][d].pval)]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(pRows), "P_values");

  // Feuille synthese (sig = p < 0.05)
  const synthRows = [['Indice', 'Debit', 'Rho', 'P-value', 'N', 'Significatif']];
  indices.forEach(idx => {
    debits.forEach(d => {
      const r = matrice[idx][d];
      synthRows.push([idx, d, r.rho, r.pval, r.n, r.pval !== null && r.pval < 0.05 ? 'OUI' : 'NON']);
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(synthRows), "Synthese");
  XLSX.writeFile(wb, "Matrice_Spearman_ETCCDI_Debits.xlsx");
}

  reader.onload=function(evt){
    try{
      if(typeof XLSX==='undefined'){alert('XLSX non charge. Verifiez votre connexion.');return;}
      const wb=XLSX.read(evt.target.result,{type:'binary',cellDates:false});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const json=XLSX.utils.sheet_to_json(ws,{raw:false,dateNF:'DD/MM/YYYY'});

      window._importState.data[key]=json;
      window._importState.activeTab=key;
      setState({screen:'import'});

function calculPercentilesDebits(dataDebit){
  if(!dataDebit||!dataDebit.length)return null;
  const cols=Object.keys(dataDebit[0]);
  const dateCol=cols.find(c=>c.toLowerCase().includes('date'))||cols[0];
  const debitCol=cols.find(c=>!c.toLowerCase().includes('date'))||cols[1];
  const years=[...new Set(dataDebit.map(r=>getYear(r[dateCol])).filter(Boolean))].sort((a,b)=>a-b);
  const Q5=[],Q10=[],Q50=[],Q90=[],Q95=[],Qmoy=[];
  years.forEach(an=>{
    const vals=dataDebit.filter(r=>getYear(r[dateCol])===an).map(r=>parseNum(r[debitCol])).filter(v=>v!==null&&!isNaN(v)).sort((a,b)=>a-b);
    if(!vals.length){Q5.push(null);Q10.push(null);Q50.push(null);Q90.push(null);Q95.push(null);Qmoy.push(null);return;}
    Q5.push(+percentile(vals,5).toFixed(3));
    Q10.push(+percentile(vals,10).toFixed(3));
    Q50.push(+percentile(vals,50).toFixed(3));
    Q90.push(+percentile(vals,90).toFixed(3));
    Q95.push(+percentile(vals,95).toFixed(3));
    Qmoy.push(+(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(3));
  });
  return{annees:years,Q5,Q10,Q50,Q90,Q95,Qmoy};
}

// ============================================================
// HEATMAP COLOR
// ============================================================
function heatmapColor(rho,pval){
  if(rho===null)return'#1a2f42';
  const sig=pval!==null&&pval<0.05;
  const abs=Math.abs(rho);
  if(rho>0){const i=Math.round(abs*200);return sig?'rgb(0,'+(100+i)+','+(150+Math.round(abs*50))+')'  :'rgba(78,203,160,'+(0.15+abs*0.4)+')';}
  else{const i=Math.round(abs*200);return sig?'rgb('+(150+i)+',50,50)':'rgba(224,96,96,'+(0.15+abs*0.4)+')';}
}

function importBaseDirecte(event){
  var file=event.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(evt){
    try{
      var wb=XLSX.read(evt.target.result,{type:'binary',cellDates:false});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var json=XLSX.utils.sheet_to_json(ws,{raw:false,dateNF:'DD/MM/YYYY'});
      if(!json||!json.length){alert('Fichier vide.');return;}
      var norm=json.map(function(row){
        var nr={};
        Object.entries(row).forEach(function(e){
          var k=e[0].trim(),v=e[1];
          if(typeof v==='string'){var n=parseFloat(v.replace(',','.'));nr[k]=isNaN(n)?v:n;}
          else nr[k]=v;
        });
        return nr;
      });
      setState({baseDirecte:norm,baseDirecteFile:file.name});
    }catch(e){alert('Erreur: '+e.message);}
  };
  reader.readAsBinaryString(file);
}

function os1CalcLancerB(){
  var base=state.baseDirecte;
  if(!base||base.length<3){alert('Chargez d abord le fichier Excel fusionne.');return;}
  var cols=Object.keys(base[0]);
  var anneeCol=cols.find(function(c){return c.toLowerCase().includes('ann')||c.toLowerCase().includes('year');})||cols[0];
  var dkws=['q5','q10','q50','q90','q95','qmoy'];
  var debitsCols=cols.filter(function(c){return dkws.some(function(k){return c.toLowerCase().replace(/[^a-z0-9]/g,'')===k;});});
  if(!debitsCols.length)debitsCols=cols.slice(1,4);
  var debitsChoisis=[];
  ['Q50',state.spearmanQetiage,state.spearmanQcrue].forEach(function(q){
    var match=cols.find(function(c){return c.toLowerCase().replace(/[^a-z0-9]/g,'')===q.toLowerCase().replace(/[^a-z0-9]/g,'');});
    if(match&&!debitsChoisis.includes(match))debitsChoisis.push(match);
  });
  if(!debitsChoisis.length)debitsChoisis=debitsCols.slice(0,3);
  var indicesCols=cols.filter(function(c){return c!==anneeCol&&!debitsCols.includes(c);});
  var matrice={};
  indicesCols.forEach(function(idx){
    matrice[idx]={};
    var xArr=base.map(function(r){return parseNum(r[idx]);});
    debitsChoisis.forEach(function(dbt){
      var yArr=base.map(function(r){return parseNum(r[dbt]);});
      matrice[idx][dbt]=spearman(xArr,yArr);
    });
  });
  setState({os1CalcResults:{matrice:matrice,debits:debitsChoisis,indices:indicesCols},baseFusionnee:base});
}

    var sel=state.spearmanQcrue===q;
    html+='<div id="btn-crue-'+q+'" style="flex:1;padding:10px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;text-align:center;border:'+(sel?'1px solid #e06060':'1px solid #234055')+';background:'+(sel?'rgba(220,80,80,.15)':'#0d2235')+';color:'+(sel?'#e06060':'#6a9080')+';">'+q+'</div>';
  });
  html+='</div></div>';
  html+='<div style="padding:8px;background:#0d2235;border-radius:8px;font-size:11px;color:#8ab5a5;text-align:center;">Debits: <strong style="color:#4ecba0;">'+state.spearmanQetiage+' - Q50 - '+state.spearmanQcrue+'</strong></div></div>';
  html+='<button onclick="os1CalcLancerB()" '+(baseD?'':'disabled')+' style="width:100%;padding:14px;background:'+(baseD?'linear-gradient(135deg,#0f6e56,#0a9e7a)':'#234055')+';color:'+(baseD?'#fff':'#4a6a5a')+';border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:'+(baseD?'pointer':'not-allowed')+';margin-bottom:8px;">Calculer la matrice de Spearman</button>';
  if(r)html+='<button onclick="exportMatriceSpearman(state.os1CalcResults)" style="width:100%;padding:10px;background:rgba(130,100,220,.1);color:#a080e0;border:1px solid rgba(130,100,220,.3);border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;margin-bottom:12px;">Exporter matrice Spearman (Excel)</button>';
  html+=heatHtml;
  html+='</div>'+drawerMenu();
  setTimeout(function(){
    ['Q5','Q10'].forEach(function(q){
      var el=document.getElementById('btn-etiage-'+q);
      if(el) el.onclick=function(){setEtiage(q);};
    });
    ['Q90','Q95'].forEach(function(q){
      var el=document.getElementById('btn-crue-'+q);
      if(el) el.onclick=function(){setCrue(q);};
    });
  },50);
  return html;
}

function render() {
  const screenMap = {
    accueil:      screenAccueil,
    auth:         screenAuth,
    dashboard:    screenDashboard,
    prediction:   screenPrediction,
    os1:          screenOS1,
    os2:          screenOS2,
    os3:          screenOS3,
    alertes:      screenAlertes,
    profil:       screenProfil,
    stations:     screenStations,
    import:       screenImport,
    etccdi:       screenETCCDI,
    debits:       screenDebits,
    os1calc:      screenOS1Calc,
  };
  const fn = screenMap[state.screen];
  document.getElementById("app").innerHTML = fn ? fn() : screenAccueil();
}

render();

  if(!email || !emailRe.test(email.trim())) errors.email = "Adresse email invalide.";
  if(!identifiant || identifiant.trim().length < 3) errors.identifiant = "L'identifiant doit contenir au moins 3 caractères.";
  else if(!/^[a-zA-Z0-9._-]+$/.test(identifiant.trim())) errors.identifiant = "Lettres, chiffres, points, tirets et underscores uniquement.";
  if(!pass || pass.length < 6) errors.pass = "Le mot de passe doit contenir au moins 6 caractères.";
  if(!passConfirm) errors.passConfirm = "Merci de confirmer le mot de passe.";
  else if(pass && passConfirm && pass !== passConfirm) errors.passConfirm = "Les mots de passe ne correspondent pas.";
  if(!inst || inst.trim().length < 2) errors.inst = "L'institution est obligatoire.";
  if(!['scientifique', 'décideur'].includes(role)) errors.role = "Veuillez choisir un rôle valide.";
  return errors;
}

function showFieldError(fieldId, message) {
  const input = document.getElementById(fieldId);
  const err = document.getElementById(fieldId + "-error");
  if(input) input.classList.add("input-error");
  if(err) { err.textContent = message; err.classList.add("show"); }
}
function clearFieldErrors(ids) {
  ids.forEach(id => {
    const input = document.getElementById(id);
    const err = document.getElementById(id + "-error");
    if(input) input.classList.remove("input-error");
    if(err) { err.textContent = ""; err.classList.remove("show"); }
  });
}
function showFormAlert(id, message, variant) {
  const box = document.getElementById(id);
  if(box) {
    box.textContent = message;
    box.classList.add("show");
    box.classList.toggle("info", variant === "info");
  }
}
function hideFormAlert(id) {
  const box = document.getElementById(id);
  if(box) { box.classList.remove("show"); box.classList.remove("info"); }
}

async function registerAccount({nom, email, identifiant, pass, inst, role}) {
  const { data: authData, error: authError } = await supabaseClient.auth.signUp({
    email: email,
    password: pass,
    options: {
      data: { nom: nom, identifiant: identifiant, institution: inst, role: role }
    }
  });
  if(authError) throw new Error(traduireErreurSupabase(authError.message));
  return authData.user;
}

async function loginAccount(email, pass) {
  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: pass
  });
  if(error) throw new Error(traduireErreurSupabase(error.message));

  let { data: profile, error: profileError } = await supabaseClient
    .from('profiles')
    .select('*')
    .eq('id', data.user.id)
    .single();

  if(profileError) {
    const meta = data.user.user_metadata || {};
    const fallbackRole = ['décideur', 'scientifique'].includes(meta.role) ? meta.role : 'scientifique';
    const fallback = {
      nom: meta.nom || email.split("@")[0],
      identifiant: meta.identifiant || email.split("@")[0],
      inst: meta.institution || "Non renseignée",
      role: fallbackRole
    };

    const { data: newProfile, error: insertError } = await supabaseClient
      .from('profiles')
      .insert({ id: data.user.id, identifiant: fallback.identifiant, nom: fallback.nom, institution: fallback.inst, role: fallback.role })
      .select()
      .single();

    if(insertError) {
      if(insertError.message.includes("duplicate key") || insertError.code === "23505") {
        throw new Error("Cet identifiant est déjà utilisé. Contacte un administrateur.");
      }
      throw new Error("Connexion réussie mais échec de création du profil : " + insertError.message);
    }

    profile = newProfile;
  }

  return { ...profile, email: data.user.email };
}

function traduireErreurSupabase(msg) {
  if(msg.includes("already registered")) return "Cet email est déjà utilisé.";
  if(msg.includes("Email not confirmed")) return "Email non confirmé. Vérifie ta boîte mail (et spams) puis clique sur le lien de confirmation.";
  if(msg.includes("Invalid login credentials")) return "Email ou mot de passe incorrect.";
  if(msg.includes("Password should be")) return "Le mot de passe doit contenir au moins 6 caractères.";
  return msg;
}

async function doLogin() {
  hideFormAlert("login-alert");
  clearFieldErrors(["login-user","login-pass"]);

  const email = (document.getElementById("login-user")?.value || "").trim();
  const pass = document.getElementById("login-pass")?.value || "";

  let hasError = false;
  if(!email) { showFieldError("login-user","L'email est obligatoire."); hasError = true; }
  if(!pass) { showFieldError("login-pass","Le mot de passe est obligatoire."); hasError = true; }
  if(hasError) return;

  const btn = document.getElementById("login-btn");
  if(btn) { btn.disabled = true; btn.textContent = "Connexion en cours..."; }

  try {
    const profile = await loginAccount(email, pass);
    setState({
      user: { nom: profile.nom, role: profile.role, email: profile.email, institution: profile.institution, identifiant: profile.identifiant, avatar_url: profile.avatar_url },
      screen: "dashboard"
    });
  } catch(e) {
    showFormAlert("login-alert", e.message);
  } finally {
    if(btn) { btn.disabled = false; btn.textContent = "Se connecter"; }
  }
}

async function doRegister() {
  hideFormAlert("reg-alert");
  clearFieldErrors(["reg-nom","reg-email","reg-identifiant","reg-pass","reg-pass-confirm","reg-inst"]);

  const nom  = document.getElementById("reg-nom")?.value || "";
  const email= document.getElementById("reg-email")?.value || "";
  const identifiant = document.getElementById("reg-identifiant")?.value || "";
  const pass = document.getElementById("reg-pass")?.value || "";
  const passConfirm = document.getElementById("reg-pass-confirm")?.value || "";
  const inst = document.getElementById("reg-inst")?.value || "";
  const role = state.selectedRegRole;

  const errors = validateRegistration({nom, email, identifiant, pass, passConfirm, inst, role});
  if(Object.keys(errors).length > 0) {
    if(errors.nom) showFieldError("reg-nom", errors.nom);
    if(errors.email) showFieldError("reg-email", errors.email);
    if(errors.identifiant) showFieldError("reg-identifiant", errors.identifiant);
    if(errors.pass) showFieldError("reg-pass", errors.pass);
    if(errors.passConfirm) showFieldError("reg-pass-confirm", errors.passConfirm);
    if(errors.inst) showFieldError("reg-inst", errors.inst);
    showFormAlert("reg-alert", "Merci de corriger les champs indiqués ci-dessous.");
    return;
  }

  const btn = document.getElementById("reg-btn");
  if(btn) { btn.disabled = true; btn.textContent = "Création en cours..."; }

  try {
    await registerAccount({
      nom: nom.trim(),
      email: email.trim(),
      identifiant: identifiant.trim(),
      pass: pass,
      inst: inst.trim(),
      role: role
    });

    hideFormAlert("reg-alert");
    setState({ screen: "auth", authTab: "login" });
    setTimeout(() => {
      showFormAlert("login-alert", "Compte créé ! Vérifie ta boîte mail pour valider ton compte avant de te connecter.", "info");
    }, 50);
  } catch(e) {
    console.error("Erreur inscription:", e);
    showFormAlert("reg-alert", e.message);
  } finally {
    if(btn) { btn.disabled = false; btn.textContent = "Créer mon compte"; }
  }
}

async function handleAvatarChange(event) {
  const file = event.target.files?.[0];
  if(!file) return;

  if(!["image/png","image/jpeg","image/webp"].includes(file.type)) {
    alert("Format non supporté. Utilise une image PNG, JPEG ou WebP.");
    return;
  }
  if(file.size > 4 * 1024 * 1024) {
    alert("Image trop lourde (max 4 Mo).");
    return;
  }

  setState({ avatarUploading: true });

  try {
    const { data: sessionData } = await supabaseClient.auth.getSession();
    const userId = sessionData?.session?.user?.id;
    if(!userId) throw new Error("Session expirée, reconnecte-toi.");

    const ext = file.name.split(".").pop().toLowerCase();
    const path = `${userId}/avatar.${ext}`;

    const { error: uploadError } = await supabaseClient.storage
      .from("avatars")
      .upload(path, file, { upsert: true, cacheControl: "3600" });
    if(uploadError) throw uploadError;

    const { data: publicUrlData } = supabaseClient.storage
      .from("avatars")
      .getPublicUrl(path);

    const avatarUrl = publicUrlData.publicUrl + "?t=" + Date.now();

    const { error: updateError } = await supabaseClient
      .from("profiles")
      .update({ avatar_url: avatarUrl })
      .eq("id", userId);
    if(updateError) throw updateError;

    setState({
      user: { ...state.user, avatar_url: avatarUrl },
      avatarUploading: false
    });
  } catch(e) {
    console.error("Erreur upload avatar:", e);
    alert("Échec de l'envoi de la photo : " + e.message);
    setState({ avatarUploading: false });
  }
}

          <div style="display:flex;justify-content:space-between;">
            <strong style="color:#4ecba0;font-size:13px;">Cumul Annuel (PRCPTOT)</strong>
            <span class="badge">Impact Élevé</span>
          </div>
          <div style="font-size:11px;color:#8ab5a5;margin-top:4px;">Les années très arrosées soutiennent des niveaux de crue plus durables.</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title"> Facteurs de Sécheresse & Étiage (Q₅)</div>
        <div class="card-sub">Périodes de bas niveau d'eau</div>
        <div style="background:#0d2235;padding:12px;border-radius:8px;">
          <div style="display:flex;justify-content:space-between;">
            <strong style="color:#e0a060;font-size:13px;">Séquences Sèches (CDD)</strong>
            <span class="badge alert">Impact Négatif Fort</span>
          </div>
          <div style="font-size:11px;color:#8ab5a5;margin-top:4px;">Plus le nombre de jours secs consécutifs augmente, plus le débit médian et les réserves en eau s'effondrent.</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Cartographie des Zones à Risque</div>
        <img src="${IMG_BASE}/spatialisation_ETCCDI_Bonou_finale.png" alt="Spatialisation" style="width:100%;border-radius:10px;margin-top:6px;"/>
      </div>
    </div>
    ${drawerMenu()}`;
  }

  // Vue Scientifique
  return `
  ${header("Indices significatifs","Corrélation de Spearman · n=30 · α=0.05", true)}
  <div class="content">
    <div class="tabs">
      <div class="tab ${state.os1Tab==='tableau'?'active':''}" onclick="setState({os1Tab:'tableau'})">Tableau</div>
      <div class="tab ${state.os1Tab==='barre'?'active':''}" onclick="setState({os1Tab:'barre'})">Classement</div>
      <div class="tab ${state.os1Tab==='selec'?'active':''}" onclick="setState({os1Tab:'selec'})">Sélectionnés</div>
      <div class="tab ${state.os1Tab==='cartes'?'active':''}" onclick="setState({os1Tab:'cartes'})">Cartes</div>
    </div>

    ${state.os1Tab==='tableau' ? `
    <div class="card">
      <div class="card-title">Matrice 16 × 3</div>
      <div class="card-sub">* = significatif (p &lt; 0.05)</div>
      <div style="overflow-x:auto;">
      <table class="spearman-table">
        <tr><th>Indice</th><th>Q₅</th><th>Q₅₀</th><th>Q₉₅</th></tr>
        ${SPEARMAN_DATA.map(d=>`<tr>
          <td>${d.indice}</td>
          <td>${rhoDisplay(d.Q5.rho,d.Q5.sig)}</td>
          <td>${rhoDisplay(d.Q50.rho,d.Q50.sig)}</td>
          <td>${rhoDisplay(d.Q95.rho,d.Q95.sig)}</td>
        </tr>`).join("")}
      </table></div>
    </div>` : ""}

    ${state.os1Tab==='barre' ? `
    <div class="tabs" style="margin-bottom:8px;">
      <div class="tab ${state.selectedDebit==='Q5'?'active':''}" onclick="setState({selectedDebit:'Q5'})">Q₅</div>
      <div class="tab ${state.selectedDebit==='Q50'?'active':''}" onclick="setState({selectedDebit:'Q50'})">Q₅₀</div>
      <div class="tab ${state.selectedDebit==='Q95'?'active':''}" onclick="setState({selectedDebit:'Q95'})">Q₉₅</div>
    </div>
    <div class="card">
      <div class="card-title">Classement — ${state.selectedDebit}</div>
      ${[...SPEARMAN_DATA]
        .sort((a,b)=>Math.abs(b[state.selectedDebit].rho)-Math.abs(a[state.selectedDebit].rho))
        .slice(0,8).map(d=>{
          const v=d[state.selectedDebit];
          return `<div class="bar-row">
            <div class="bar-label">${d.indice}</div>
            <div class="bar-track">
              <div class="bar-fill ${v.rho>0?'bar-pos':'bar-neg'}" style="width:${barWidth(v.rho)}%">
                ${v.rho.toFixed(2)}${v.sig?"*":""}
              </div>
            </div></div>`;
        }).join("")}
    </div>` : ""}

    ${state.os1Tab==='selec' ? `
    <div class="card">
      <div class="card-title">6 indices sélectionnés</div>
      <div class="card-sub">Shapiro-Wilk + analyse de multicolinéarité</div>
      <div class="section-label">Précipitations (4)</div>
      ${["PRCPTOT","Rx1day","Rx5day","CDD"].map(i=>`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px;background:#0d2235;border-radius:8px;margin-bottom:6px;">
        <span style="color:#4ecba0;font-weight:600;font-size:13px;">${i}</span>
        <span style="color:#8ab5a5;font-size:11px;">${SPEARMAN_DATA.find(d=>d.indice===i)?.nom}</span>
      </div>`).join("")}
      <div class="section-label" style="margin-top:10px;">Températures (2)</div>
      ${["TR","CSDI"].map(i=>`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px;background:#0d2235;border-radius:8px;margin-bottom:6px;">
        <span style="color:#e0a060;font-weight:600;font-size:13px;">${i}</span>
        <span style="color:#8ab5a5;font-size:11px;">${SPEARMAN_DATA.find(d=>d.indice===i)?.nom}</span>
      </div>`).join("")}
    </div>` : ""}

    ${state.os1Tab==='cartes' ? screenOS1Cartes() : ""}
  </div>
  ${drawerMenu()}`;
}

function screenOS1Cartes() {
  const sousTabs = [
    { id:"precip", label:"Précipitations" },
    { id:"temp",   label:"Températures" },
    { id:"correl", label:"Corrélations" },
  ];

  const contenu = {
    precip: `
      <div class="card">
        <div class="card-title">Spatialisation ETCCDI — Précipitations</div>
        <div class="card-sub">PRCPTOT, Rx1day, Rx5day, R10mm, R20mm, SDII, CDD, CWD · IDW</div>
        <img src="${IMG_BASE}/spatialisation_ETCCDI_Bonou_finale.png" alt="Spatialisation indices précipitations" style="width:100%;border-radius:10px;margin-top:6px;"/>
      </div>`,
    temp: `
      <div class="card">
        <div class="card-title">Spatialisation ETCCDI — Températures</div>
        <div class="card-sub">SU25, TR20, TN10p, TX10p, TN90p, TX90p, WSDI, CSDI · IDW</div>
        <img src="${IMG_BASE}/spatialisation_temperature_Bonou_IDW.png" alt="Spatialisation indices températures" style="width:100%;border-radius:10px;margin-top:6px;"/>
      </div>`,
    correl: `
      <div class="card">
        <div class="card-title">Heatmap Spearman — vue d'ensemble</div>
        <div class="card-sub">16 indices × 3 débits (Q₅, Q₅₀, Q₉₅)</div>
        <img src="${IMG_BASE}/Heatmap_Spearman.png" alt="Heatmap Spearman" style="width:100%;border-radius:10px;margin-top:6px;"/>
      </div>
      <div class="card">
        <div class="card-title">Corrélogramme — Précipitations significatives</div>
        <img src="${IMG_BASE}/Correlogramme_Spearman_pluies_singif.png" alt="Corrélogramme pluies" style="width:100%;border-radius:10px;margin-top:6px;"/>
      </div>
      <div class="card">
        <div class="card-title">Corrélogramme — Température (TR / CSDI)</div>
        <div class="card-sub">Antiphase marquée : ρ = −0.75</div>
        <img src="${IMG_BASE}/Correlogramme_Spearman_Temperature_signif.png" alt="Corrélogramme température" style="width:100%;border-radius:10px;margin-top:6px;"/>
      </div>`
  };

  return `
    <div class="tabs" style="margin-bottom:8px;">
      ${sousTabs.map(t=>`
      <div class="tab ${state.os1CarteTab===t.id?'active':''}" onclick="setState({os1CarteTab:'${t.id}'})">${t.label}</div>`).join("")}
    </div>
    ${contenu[state.os1CarteTab] || contenu.precip}
  `;
}

// ------------------------------------------------------------
// OS2 & OS3 (Adaptés)
// ------------------------------------------------------------
function screenOS2() {
  const isDecideur = state.user?.role === 'décideur';

  const variables = [
    { id:"hydro",  label:"Hydrologie",    fichier:"Scalogramme_Hydrologie.png",
      interp: isDecideur 
        ? "Le débit de la rivière suit un cycle majeur de 4 ans. Les périodes les plus humides et critiques ont été observées entre 2008 et 2015."
        : "Le scalogramme des débits révèle une structure cohérente à l'échelle de 4 ans, particulièrement marquée entre 2008 et 2015 — oscillation quadriennale liée aux cycles ENSO." },
    { id:"precip", label:"Précipitation", fichier:"Scalogramme_Precipitation.png",
      interp: isDecideur
        ? "Les fortes pluies présentent un cycle récurrent de 4 à 5 ans, notamment entre 2000 et 2008, correspondant aux grandes crues historiques."
        : "Le signal pluviométrique présente sa structure la plus significative à l'échelle 4–5 ans entre 2000 et 2008, coïncidant avec les crues majeures." },
    { id:"temp",   label:"Température",   fichier:"Scalogramme_Temperature.png",
      interp: isDecideur
        ? "Les températures varient sur des cycles plus courts (2 à 3 ans) sans régularité stricte."
        : "Le scalogramme thermique montre une variabilité plus localisée à l'échelle 2–3 ans, sans mode dominant global stable." },
  ];
  const v = variables.find(x=>x.id===state.os2VarTab) || variables[0];
  return `
  ${header(isDecideur ? "Cycles & Tendances" : "Variabilité temporelle", isDecideur ? "Évolution pluriannuelle des extrêmes" : "Transformée en ondelettes continues (CWT)", true)}
  <div class="content">
    <div class="tabs">
      ${variables.map(item=>`
      <div class="tab ${state.os2VarTab===item.id?'active':''}" onclick="setState({os2VarTab:'${item.id}'})">${item.label}</div>`).join("")}
    </div>
    <div class="card">
      <div class="card-title">${isDecideur ? "Graphique de tendance : " + v.label : "Scalogramme CWT — " + v.label}</div>
      <img src="${IMG_BASE}/${v.fichier}" alt="Scalogramme ${v.label}" loading="lazy"
           style="width:100%;border-radius:10px;margin-top:4px;background:#0d2235;min-height:160px;"/>
    </div>
    <div class="card">
      <div class="card-title">${isDecideur ? "Ce qu'il faut retenir" : "Interprétation"}</div>
      <div class="interp-box ${isDecideur?'decideur-box':''}">${v.interp}</div>
    </div>
  </div>
  ${drawerMenu()}`;
}

function screenOS3() {
  const isDecideur = state.user?.role === 'décideur';

  if(isDecideur) {
    return `
    ${header("Guide de Décision","Comprendre et anticiper les impacts", true)}
    <div class="content">
      <div class="card">
        <div class="card-title"> Synthèse d'Anticipation</div>
        <div class="interp-box decideur-box">
          <strong>Stratégie de Prévention :</strong>
          <ul style="margin-left:16px;margin-top:6px;line-height:1.6;">
            <li>En cas de pluies intenses répétées sur 5 jours (Rx5day), déclencher le niveau de pré-alerte crue à Bonou.</li>
            <li>En période de sécheresse prolongée (CDD > 70j), restreindre préventivement les prélèvements d'eau pour protéger les débits d'étiage.</li>
          </ul>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Tableau Récapitulatif de Cause à Effet</div>
        <div style="font-size:12px;line-height:1.8;color:#8ab5a5;">
          <div style="padding:8px;background:#0d2235;border-radius:6px;margin-bottom:6px;">
            <strong style="color:#4ecba0;">Pluies de 5 jours ➔ Crue à Bonou</strong><br>
            Réponse rapide du bassin. Recommandation : Suivi pluviométrique strict.
          </div>
          <div style="padding:8px;background:#0d2235;border-radius:6px;">
            <strong style="color:#e0a060;">Sécheresses longues ➔ Baisse des réserves</strong><br>
            Impact direct sur les débits bas. Recommandation : Plan de soutien d'étiage.
          </div>
        </div>
      </div>
    </div>
    ${drawerMenu()}`;
  }

  // Vue Scientifique
  return `
  ${header("Relations de phase","Ondelettes croisées · Cohérence · 9 paires", true)}
  <div class="content">
    <div class="tabs">
      <div class="tab ${state.os3Tab==='xwt'?'active':''}" onclick="setState({os3Tab:'xwt'})">Phases XWT</div>
      <div class="tab ${state.os3Tab==='wtc'?'active':''}" onclick="setState({os3Tab:'wtc'})">Cohérence WTC</div>
      <div class="tab ${state.os3Tab==='synth'?'active':''}" onclick="setState({os3Tab:'synth'})">Synthèse</div>
    </div>

    ${state.os3Tab==='xwt' ? `
    <div class="card">
      <div class="card-title">Ondelettes croisées (XWT)</div>
      <div class="card-sub">Puissance de phase commune entre indice et débit</div>
      <img src="${IMG_BASE}/transformee_ondelettes_croisees.png" alt="Transformée en ondelettes croisées" loading="lazy"
           style="width:100%;border-radius:10px;margin-top:4px;background:#0d2235;min-height:160px;"/>
    </div>
    <div class="card">
      <div class="card-title">Relations de phase — 9 paires</div>
      <div class="card-sub">→ en phase · ← antiphase · ↓ 1er précède · ↘ retard</div>
      ${INDICES_SIGNIFICATIFS.map(d=>`
      <div class="phase-card">
        <div class="phase-arrow">${d.phase}</div>
        <div class="phase-info">
          <div class="pair">${d.indice} — ${d.debit} · ρ=${d.rho>0?"+":""}${d.rho.toFixed(3)}</div>
          <div class="interp">${d.interp}</div>
        </div>
      </div>`).join("")}
    </div>` : ""}

    ${state.os3Tab==='wtc' ? `
    <div class="card">
      <div class="card-title">Cohérence en ondelettes (WTC)</div>
      <div class="card-sub">Zones de forte cohérence phase-amplitude</div>
      <img src="${IMG_BASE}/coherence_ondelettes.png" alt="Cohérence en ondelettes" loading="lazy"
           style="width:100%;border-radius:10px;margin-top:4px;background:#0d2235;min-height:160px;"/>
    </div>` : ""}

    ${state.os3Tab==='synth' ? `
    <div class="card">
      <div class="card-title">Synthèse OS3</div>
      <div class="section-label">Crues extrêmes (Q₉₅)</div>
      <div class="interp-box">Relations en phase avec Rx5day, Rx1day, PRCPTOT. Réponse quasi-synchrone aux pluies intenses. Période dominante : 4 ans · 1998–2010.</div>
    </div>` : ""}
  </div>
  ${drawerMenu()}`;
}

  const isDecideur = u.role === 'décideur';

  <div class="content">
    <div class="card" style="text-align:center;padding:24px 16px;">
      <div class="avatar-wrap">
        <div class="profile-avatar">${state.avatarUploading ? `…` : avatarContent}</div>
        <div class="avatar-edit-btn" onclick="document.getElementById('avatar-input').click()">✏️</div>
        <input type="file" id="avatar-input" accept="image/png,image/jpeg,image/webp" style="display:none;" onchange="handleAvatarChange(event)"/>
      </div>
      <div class="profile-name">${u.nom || "Utilisateur"}</div>
      <div class="profile-role ${isDecideur?'decideur':''}">${u.role || "scientifique"}</div>
    </div>
    <div class="card">
      <div class="card-title">Informations Compte</div>
      <div style="font-size:12px;color:#8ab5a5;line-height:2;">

          <span style="color:${isDecideur?'#e0a060':'#4ecba0'};text-transform:capitalize;">${u.role}</span>
        </div>
        <div style="display:flex;justify-content:space-between;">
          <span>Bassin suivi</span>
          <span style="color:#e8f4f0;">Ouémé à Bonou</span>

    <button class="btn-danger" onclick="doLogout()">🚪 Se déconnecter</button>
  </div>
  ${drawerMenu()}`;
}

function screenStations() {
  return `
  ${header("Gestion des stations","25 pluviométriques · 4 synoptiques", true)}
  <div class="content">
    <div class="card">
      <div class="card-title">Stations pluviométriques (25)</div>
      <div class="stations-grid">
        ${STATIONS.map(s=>`
        <div class="station-item ${s===state.selectedStation?'selected':''}"
             onclick="setState({selectedStation:'${s}'})">${s}</div>`).join("")}
      </div>

}

function screenImport() {
  return `
  ${header("Import des données","Charger un nouveau jeu de données", true)}
  <div class="content">
    <div class="card" style="border:2px dashed #234055;background:#0d1b2a;text-align:center;padding:32px 16px;">
      <div style="font-size:36px;margin-bottom:8px;">📂</div>
      <div style="font-size:13px;color:#4ecba0;font-weight:600;">Glisser un fichier Excel (.xlsx)</div>
    </div>
  </div>`;
}

// ============================================================
// RENDER
// ============================================================
function render() {
  const screenMap = {
    accueil:      screenAccueil,
    auth:         screenAuth,
    dashboard:    screenDashboard,
    os1:          screenOS1,
    os2:          screenOS2,
    os3:          screenOS3,
    alertes:      screenAlertes,
    profil:       screenProfil,
    stations:     screenStations,
    import:       screenImport,
  };
  const fn = screenMap[state.screen];
  document.getElementById("app").innerHTML = fn ? fn() : screenAccueil();
}

render();
</script>

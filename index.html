  /* ============================================================
     ANIMATION BASSIN VERSANT — écran d'accueil
     Réseau de rivières (motif dendritique) qui "coule" en boucle,

  ============================================================ */
  .basin-hero { position: relative; width: 100%; height: 220px; overflow: hidden; border-radius: 0 0 24px 24px; background: radial-gradient(ellipse at 50% 0%, #123a2e 0%, #0d1b2a 70%); }
  .basin-hero svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .basin-river { fill: none; stroke: #4ecba0; stroke-linecap: round; opacity: 0.55; }
  .basin-river.flow {
    stroke-dasharray: 6 10;
    animation: basin-flow 3.5s linear infinite;
  }
  .basin-river.flow-slow { animation-duration: 5.5s; opacity: 0.35; }
  .basin-river.flow-fast { animation-duration: 2.2s; opacity: 0.7; }
  @keyframes basin-flow {
    to { stroke-dashoffset: -160; }
  }
  .basin-drop {
    position: absolute;
    width: 3px; height: 10px;
    background: linear-gradient(#9fe1cb, #4ecba0);
    border-radius: 2px;
    opacity: 0;
    animation: basin-drop-fall linear infinite;
  }
  @keyframes basin-drop-fall {
    0%   { transform: translateY(-10px); opacity: 0; }
    10%  { opacity: 0.9; }
    85%  { opacity: 0.6; }
    100% { transform: translateY(190px); opacity: 0; }
  }
  .basin-ripple {
    position: absolute;
    width: 6px; height: 6px;
    border: 1.5px solid #4ecba0;
    border-radius: 50%;
    opacity: 0;
    animation: basin-ripple-grow linear infinite;

    text-align: center; font-size: 10px; letter-spacing: 0.1em;
    color: #7dcfb0; text-transform: uppercase; opacity: 0.75;
  }
  @media (prefers-reduced-motion: reduce) {
    .basin-river.flow, .basin-drop, .basin-ripple { animation: none !important; }

function validateRegistration({nom, email, pass, passConfirm, inst}) {
  const errors = {};
  if(!nom || nom.trim().length < 3) errors.nom = "Le nom complet doit contenir au moins 3 caractères.";
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if(!email || !emailRe.test(email.trim())) errors.email = "Adresse email invalide.";
  if(!pass || pass.length < 6) errors.pass = "Le mot de passe doit contenir au moins 6 caractères.";
  if(!passConfirm) errors.passConfirm = "Merci de confirmer le mot de passe.";
  else if(pass && passConfirm && pass !== passConfirm) errors.passConfirm = "Les mots de passe ne correspondent pas.";
  if(!inst || inst.trim().length < 2) errors.inst = "L'institution est obligatoire.";
  return errors;
}

function showFieldError(fieldId, message) {
  const input = document.getElementById(fieldId);
  const err = document.getElementById(fieldId + "-error");
  if(input) input.classList.add("input-error");
  if(err) { err.textContent = message; err.classList.add("show"); }
}
function clearFieldErrors(ids) {
  ids.forEach(id => {
    const input = document.getElementById(id);
    const err = document.getElementById(id + "-error");
    if(input) input.classList.remove("input-error");
    if(err) { err.textContent = ""; err.classList.remove("show"); }
  });
}
function showFormAlert(id, message) {
  const box = document.getElementById(id);
  if(box) { box.textContent = message; box.classList.add("show"); }
}
function hideFormAlert(id) {
  const box = document.getElementById(id);
  if(box) { box.classList.remove("show"); }

    password: pass

  if(authError) throw new Error(traduireErreurSupabase(authError.message));

  sessionStorage.setItem('pending_profile_' + email, JSON.stringify({ nom, identifiant, inst, role }));

  return authData.user;

      .from('profiles')
      .insert({ id: data.user.id, identifiant: pending.identifiant, nom: pending.nom, institution: pending.inst, role: pending.role })
      .select()
      .single();

    if(insertError) throw new Error("Connexion réussie mais échec de création du profil : " + insertError.message);

    sessionStorage.removeItem('pending_profile_' + email);
    profile = newProfile;
  }

  return { ...profile, email: data.user.email };
}

function traduireErreurSupabase(msg) {
  if(msg.includes("already registered")) return "Cet email est déjà utilisé.";
  if(msg.includes("Invalid login credentials")) return "Email ou mot de passe incorrect.";
  if(msg.includes("Password should be")) return "Le mot de passe doit contenir au moins 6 caractères.";
  return msg;
}

async function doLogin() {
  hideFormAlert("login-alert");
  clearFieldErrors(["login-user","login-pass"]);

  const email = (document.getElementById("login-user")?.value || "").trim();
  const pass = document.getElementById("login-pass")?.value || "";

  let hasError = false;
  if(!email) { showFieldError("login-user","L'email est obligatoire."); hasError = true; }
  if(!pass) { showFieldError("login-pass","Le mot de passe est obligatoire."); hasError = true; }
  if(hasError) return;

  const btn = document.getElementById("login-btn");
  if(btn) { btn.disabled = true; btn.textContent = "Connexion en cours..."; }

  try {
    const profile = await loginAccount(email, pass);
    setState({
      user: { nom: profile.nom, role: profile.role, email: profile.email, institution: profile.institution, identifiant: profile.identifiant },
      screen: "dashboard"
    });
  } catch(e) {
    showFormAlert("login-alert", e.message);
  } finally {
    if(btn) { btn.disabled = false; btn.textContent = "Se connecter"; }
  }
}

async function doRegister() {
  hideFormAlert("reg-alert");
  clearFieldErrors(["reg-nom","reg-email","reg-pass","reg-pass-confirm","reg-inst"]);

  const nom  = document.getElementById("reg-nom")?.value || "";
  const email= document.getElementById("reg-email")?.value || "";
  const pass = document.getElementById("reg-pass")?.value || "";
  const passConfirm = document.getElementById("reg-pass-confirm")?.value || "";
  const inst = document.getElementById("reg-inst")?.value || "";
  const role = document.getElementById("reg-role")?.value || "scientifique";

  const errors = validateRegistration({nom, email, pass, passConfirm, inst});
  if(Object.keys(errors).length > 0) {
    if(errors.nom) showFieldError("reg-nom", errors.nom);
    if(errors.email) showFieldError("reg-email", errors.email);
    if(errors.pass) showFieldError("reg-pass", errors.pass);
    if(errors.passConfirm) showFieldError("reg-pass-confirm", errors.passConfirm);
    if(errors.inst) showFieldError("reg-inst", errors.inst);
    showFormAlert("reg-alert", "Merci de corriger les champs indiqués ci-dessous.");
    return;
  }

  const identifiant = email.trim().split("@")[0] + "_" + Math.random().toString(36).slice(2,6);

  const btn = document.getElementById("reg-btn");
  if(btn) { btn.disabled = true; btn.textContent = "Création en cours..."; }

  try {
    await registerAccount({
      nom: nom.trim(),
      email: email.trim(),
      identifiant: identifiant,
      pass: pass,
      inst: inst.trim(),
      role: role
    });

    showFormAlert("reg-alert", "");
    hideFormAlert("reg-alert");
    setState({ screen: "auth", authTab: "login" });
    setTimeout(() => {
      showFormAlert("login-alert", "Compte créé ! Vérifie ta boîte mail et clique sur le lien de confirmation avant de te connecter.");
    }, 50);
  } catch(e) {
    console.error("Erreur inscription:", e);
    showFormAlert("reg-alert", e.message);
  } finally {
    if(btn) { btn.disabled = false; btn.textContent = "Créer mon compte"; }
  }
}

  ${header("Relations de phase","Ondelettes croisées · Cohérence · 9 paires", true)}
  <div class="content">
    <div class="tabs">
      <div class="tab ${state.os3Tab==='xwt'?'active':''}" onclick="setState({os3Tab:'xwt'})">Phases XWT</div>
      <div class="tab ${state.os3Tab==='wtc'?'active':''}" onclick="setState({os3Tab:'wtc'})">Cohérence WTC</div>
      <div class="tab ${state.os3Tab==='synth'?'active':''}" onclick="setState({os3Tab:'synth'})">Synthèse</div>
    </div>

    ${state.os3Tab==='xwt' ? `
    <div class="card">
      <div class="card-title">Ondelettes croisées (XWT)</div>
      <div class="card-sub">Puissance de phase commune entre indice et débit</div>
      <img src="${IMG_BASE}/transformee_ondelettes_croisees.png" alt="Transformée en ondelettes croisées" loading="lazy"
           style="width:100%;border-radius:10px;margin-top:4px;background:#0d2235;min-height:160px;"/>
    </div>
    <div class="card">
      <div class="card-title">Relations de phase — 9 paires</div>
      <div class="card-sub">→ en phase · ← antiphase · ↓ 1er précède · ↘ retard</div>
      ${INDICES_SIGNIFICATIFS.map(d=>`
      <div class="phase-card">
        <div class="phase-arrow">${d.phase}</div>
        <div class="phase-info">
          <div class="pair">${d.indice} — ${d.debit} · ρ=${d.rho>0?"+":""}${d.rho.toFixed(3)}</div>
          <div class="interp">${d.interp}</div>
        </div>
      </div>`).join("")}
    </div>` : ""}

    ${state.os3Tab==='wtc' ? `
    <div class="card">
      <div class="card-title">Cohérence en ondelettes (WTC)</div>
      <div class="card-sub">Zones de forte cohérence phase-amplitude</div>
      <img src="${IMG_BASE}/coherence_ondelettes.png" alt="Cohérence en ondelettes" loading="lazy"
           style="width:100%;border-radius:10px;margin-top:4px;background:#0d2235;min-height:160px;"/>
    </div>
    <div class="card">
      <div class="card-title">Cohérence WTC par échelle</div>
      <div class="card-sub">Période dominante : 4 ans · Fenêtre robuste : 2005–2015</div>
      ${[
        {label:"2 ans", q5:0.42, q50:0.51, q95:0.58},
        {label:"4 ans", q5:0.65, q50:0.78, q95:0.81},
        {label:"8 ans", q5:0.38, q50:0.45, q95:0.35},
        {label:"16 ans",q5:0.22, q50:0.31, q95:0.28},
      ].map(row=>`
      <div style="margin-bottom:10px;">
        <div style="font-size:11px;color:#8ab5a5;margin-bottom:4px;font-weight:600;">${row.label}</div>
        ${[["Q₅",row.q5],["Q₅₀",row.q50],["Q₉₅",row.q95]].map(([lbl,val])=>`
        <div class="coh-row">
          <div class="coh-label">${lbl}</div>
          <div class="coh-track">
            <div class="coh-fill" style="width:${val*100}%;background:${val>0.6?"linear-gradient(90deg,#0f6e56,#4ecba0)":"linear-gradient(90deg,#1a4a3a,#3a7a6a)"};">${val.toFixed(2)}</div>
          </div>
        </div>`).join("")}
      </div>`).join("")}
      <div class="interp-box">L'échelle de 4 ans concentre les cohérences les plus élevées pour les trois métriques, cohérente avec la périodicité ENSO. La fenêtre 2005–2015 est la plus robuste pour les couplages thermiques.</div>
    </div>` : ""}

    ${state.os3Tab==='synth' ? `
    <div class="card">
      <div class="card-title">Synthèse OS3</div>
      <div class="section-label">Crues extrêmes (Q₉₅)</div>
      <div class="interp-box">Relations en phase avec Rx5day, Rx1day, PRCPTOT. Réponse quasi-synchrone aux pluies intenses. Période dominante : 4 ans · 1998–2010.</div>
      <div class="section-label" style="margin-top:10px;">Débit médian (Q₅₀)</div>
      <div class="interp-box">Double forçage : en phase avec TR et PRCPTOT · antiphase avec CDD et CSDI. Fenêtre : 2005–2015.</div>
      <div class="section-label" style="margin-top:10px;">Étiages extrêmes (Q₅)</div>
      <div class="interp-box">Exclusivement gouvernés par les forçages thermiques. TR en phase · CSDI en antiphase. Variabilité apériodique.</div>
    </div>` : ""}
  </div>
  ${bottomNav()}`;
}

// ============================================================
// RENDER
// ============================================================
function render() {
  const screenMap = {
    accueil:      screenAccueil,
    auth:         screenAuth,
    dashboard:    screenDashboard,
    os1:          screenOS1,
    os2:          screenOS2,
    os3:          screenOS3,
    alertes:      screenAlertes,
    profil:       screenProfil,
    stations:     screenStations,
    import:       screenImport,
  };
  const fn = screenMap[state.screen];
  document.getElementById("app").innerHTML = fn ? fn() : screenAccueil();
}

render();
</script>
